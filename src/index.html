<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MBBS.NET</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png"> -->
  <link rel="icon" type="image/x-icon" href="/Asset 1@4x.png">
  <link rel="apple-touch-icon" href="/images/app-logo.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,1,2&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    .mbbs-preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Satoshi', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .mbbs-preloader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .mbbs-preloader-logo-frame {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mbbs-preloader-halo {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: #e3fe54;
      opacity: 0.55;
      filter: blur(14px);
      animation: mbbsPreloaderHalo 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }
    .mbbs-preloader-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      animation: mbbsPreloaderCardiac 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .mbbs-preloader-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(6, 30, 25, 0.12), 0 0 0 1px rgba(6, 30, 25, 0.04);
    }
    .mbbs-preloader-track {
      width: 110px;
      height: 3px;
      background: #e6e8ec;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 22px;
      position: relative;
    }
    .mbbs-preloader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d4f83c, #061e19);
      animation: mbbsPreloaderScan 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .mbbs-preloader-text {
      margin-top: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #061e19;
      opacity: 0.75;
    }
    @keyframes mbbsPreloaderCardiac {
      0%, 100% { transform: scale(0.95); opacity: 0.92; }
      14% { transform: scale(1.06); opacity: 1; }
      28% { transform: scale(0.98); opacity: 0.94; }
      42% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(227, 254, 84, 0.6)); }
      70% { transform: scale(0.95); opacity: 0.92; }
    }
    @keyframes mbbsPreloaderHalo {
      0% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1.45); opacity: 0.18; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes mbbsPreloaderScan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mbbs-preloader-halo,
      .mbbs-preloader-logo-wrap,
      .mbbs-preloader-bar {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="mbbs-preloader" id="mbbs-preloader" role="progressbar" aria-label="Loading MBBS.NET">
      <div class="mbbs-preloader-inner">
        <div class="mbbs-preloader-logo-frame">
          <div class="mbbs-preloader-halo" aria-hidden="true"></div>
          <div class="mbbs-preloader-logo-wrap">
            <img src="/Asset 1@4x.png" alt="MBBS.NET Logo" class="mbbs-preloader-logo" width="76" height="76" />
          </div>
        </div>
        <div class="mbbs-preloader-track" aria-hidden="true">
          <div class="mbbs-preloader-bar"></div>
        </div>
        <span class="mbbs-preloader-text">Loading MBBS.NET</span>
      </div>
    </div>
  </app-root>
</body>
</html>
