<main class="ai-chat-thread-page">
  <!-- Scrollable Messages Container -->
  <div class="messages-container" #scrollContainer (scroll)="onScroll($event)">
    <div class="messages-list">
      @for (msg of messages(); track msg.id) {
        @if (msg.sender === 'assistant') {
          <div class="message-row assistant-row">
            <div
              class="assistant-msg"
              [class.error-msg]="msg.isError"
              [innerHTML]="msg.text | safeMarkdown"
            ></div>
          </div>
        } @else {
          <div class="message-row user-row">
            <div class="user-msg">
              {{ msg.text }}
            </div>
          </div>
        }
      }

      @if (loading()) {
        <div class="message-row assistant-row">
          <div class="assistant-msg typing-indicator" aria-label="Thinking...">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Floating Scroll-to-bottom Button -->
  @if (showScrollBottom()) {
    <button
      type="button"
      class="scroll-bottom-btn"
      aria-label="Scroll to bottom"
      (click)="scrollToBottom()"
    >
      <app-icon name="arrow-down" [size]="16" />
    </button>
  }

  <!-- Fixed Bottom Input Section -->
  <div class="chat-footer-dock">
    <div class="prompt-box">
      <input
        #fileInput
        type="file"
        style="display: none"
        (change)="onFileSelected($event)"
      />

      <button
        type="button"
        class="icon-btn plus-btn"
        aria-label="Add attachment"
        (click)="fileInput.click()"
      >
        <app-icon name="plus" [size]="18" />
      </button>

      <input
        type="text"
        class="chat-input"
        placeholder="Write a message..."
        [ngModel]="promptText()"
        (ngModelChange)="promptText.set($event)"
        (keydown.enter)="$event.preventDefault(); sendMessage()"
        [disabled]="loading()"
        autocomplete="off"
      />

      <button type="button" class="icon-btn mic-btn" aria-label="Voice input">
        <app-icon name="mic" [size]="18" />
      </button>

      <button
        type="button"
        class="send-btn"
        aria-label="Send message"
        [disabled]="!canSend()"
        [attr.aria-disabled]="!canSend()"
        (click)="sendMessage()"
      >
        <app-icon name="arrow-up" [size]="18" />
      </button>
    </div>

    <p class="disclaimer-text">
      MBBS.NET AI is an intelligent assistant and can make mistakes. Please verify important admission details.
    </p>
  </div>
</main>
