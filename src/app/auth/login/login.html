<section class="auth-page">
  <a class="brand-link" routerLink="/static/dashboard">&larr; MBBS.NET</a>

  <form #loginForm="ngForm" (ngSubmit)="login()">
    <div class="form-heading">
      <p>Welcome back</p>
      <h1>Log in to your account</h1>
      <span>Continue to your NEET tests, results and insights.</span>
    </div>

    <label>
      <span>Email address</span>
      <input
        type="email"
        name="email"
        [(ngModel)]="loginData.email"
        placeholder="student@example.com"
        autocomplete="email"
        required
        email
      />
    </label>

    <label>
      <span>Password</span>
      <input
        type="password"
        name="password"
        [(ngModel)]="loginData.password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
        minlength="6"
      />
    </label>

    @if (errorMessage) {
      <p class="form-error" role="alert">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="loginForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Logging in...' : 'Login' }}
    </button>

    <p class="register-link">
      Don’t have an account?
      <a routerLink="/auth/register">Create an account</a>
    </p>
  </form>
</section>
