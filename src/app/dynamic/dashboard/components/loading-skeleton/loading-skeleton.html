<div class="skeleton" role="status" aria-live="polite" aria-label="Loading your dashboard">
  <span class="sr-only">Loading your learning feed</span>
  <section class="stats">
    @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track item) {
      <div class="stat">
        <span class="shimmer icon"></span>
        <span class="lines"><i class="shimmer short"></i><i class="shimmer"></i></span>
      </div>
    }
  </section>
  <section class="feature">
    <div class="shimmer media"></div>
    <div class="copy">
      <i class="shimmer eyebrow"></i>
      <i class="shimmer title"></i>
      <i class="shimmer title narrow"></i>
      <i class="shimmer line"></i>
      <i class="shimmer line"></i>
      <i class="shimmer button"></i>
    </div>
  </section>
  <section class="cards">
    @for (item of [1, 2, 3]; track item) {
      <div class="card">
        <i class="shimmer card-media"></i>
        <i class="shimmer eyebrow"></i>
        <i class="shimmer title"></i>
        <i class="shimmer line"></i>
      </div>
    }
  </section>
</div>
