<article>
  <div class="identity">
    <span class="avatar">
      <b>{{ author().fullName.charAt(0) }}</b>
      @if (author().profileImage) {
        <img appImageFallback [src]="author().profileImage | mediaUrl" [alt]="author().fullName" loading="lazy">
      }
    </span>
    <span class="verified" aria-label="Featured author"><app-icon name="check" [size]="11" [strokeWidth]="2.5"/></span>
  </div>
  <div class="copy">
    <span class="role">{{ author().designation }}</span>
    <h3>{{ author().fullName }}</h3>
    <p>{{ author().bio }}</p>
    <span class="articles"><app-icon name="blog" [size]="14"/> {{ author().totalBlogs ?? 0 }} published {{ (author().totalBlogs ?? 0) === 1 ? 'article' : 'articles' }}</span>
  </div>
  <div class="actions">
    <button type="button" class="profile">View profile</button>
    <button
      type="button"
      class="follow"
      [class.active]="following()"
      [attr.aria-pressed]="following()"
      (click)="following.set(!following())"
    >{{ following() ? 'Following' : 'Follow' }}</button>
  </div>
</article>
