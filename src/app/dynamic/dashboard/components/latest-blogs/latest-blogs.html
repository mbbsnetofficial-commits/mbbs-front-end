<section id="latest" aria-labelledby="latest-title">
  <app-section-header
    eyebrow="Stay informed"
    title="Latest medical reads"
    headingId="latest-title"
    description="Fresh, evidence-led articles to make complex medical topics easier to understand."
    [count]="blogs().length + (blogs().length === 1 ? ' article' : ' articles')"
  />
  @if (blogs().length) {
    <div class="grid">
      @for (blog of blogs(); track blog._id) {
        <app-blog-card [blog]="blog"/>
      }
    </div>
  } @else {
    <app-empty-state
      icon="blog"
      title="New medical insights are on the way"
      message="Our editorial team is preparing focused reads for your next study break."
      actionLabel="Practice while you wait"
      actionLink="/dynamic/neet"
      [compact]="true"
    />
  }
</section>
