<section id="categories" aria-labelledby="categories-title">
  <app-section-header
    eyebrow="Discover pathways"
    title="Explore by category"
    headingId="categories-title"
    description="Find focused guides for every stage of your medical education journey."
    [count]="categories().length + (categories().length === 1 ? ' category' : ' categories')"
  />
  @if (categories().length) {
    <div class="scroller" tabindex="0" aria-label="Medical content categories">
      @for (category of categories(); track category._id) {
        <app-category-card [category]="category"/>
      }
    </div>
  } @else {
    <app-empty-state
      icon="categories"
      title="Your knowledge library is growing"
      message="New medical learning pathways will be available here as soon as they’re published."
      actionLabel="Browse latest articles"
      actionLink="/dynamic/dashboard"
      [compact]="true"
    />
  }
</section>
