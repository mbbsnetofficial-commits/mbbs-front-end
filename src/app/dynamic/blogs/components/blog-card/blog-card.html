<article class="medium-card" [class.featured]="featured()">
  <!-- Top Header Row: Author/Publication info -->
  <div class="card-header">
    <img
      appImageFallback
      class="author-avatar"
      [src]="blog().author?.profileImage || blog().featuredImage?.url || ''"
      [alt]="blog().author?.fullName || 'Author'"
      loading="lazy"
    >
    <div class="header-meta">
      <span class="pub-byline">
        In <strong class="pub-name">{{ blog().category?.categoryName || 'Medical' }}</strong> by <strong class="author-name">{{ blog().author?.fullName || 'MBBS.NET' }}</strong>
      </span>
      <span class="dot-separator">·</span>
      <time class="pub-date" [attr.datetime]="blog().publishedAt">{{ (blog().publishedAt || blog().createdAt) | date: 'MMM d' }}</time>
    </div>
  </div>

  <!-- Main Content Row: Title & Excerpt (Left) + Cover Image (Right) -->
  <div class="card-content">
    <div class="text-col">
      <h2 class="card-title">
        <a [routerLink]="['/dynamic/blogs', blog().slug]">{{ blog().title || 'Untitled article' }}</a>
      </h2>
      <p class="card-excerpt">
        <a [routerLink]="['/dynamic/blogs', blog().slug]">{{ displayExcerpt() }}</a>
      </p>
    </div>

    @if (blog().featuredImage?.url) {
      <a class="thumb-col" [routerLink]="['/dynamic/blogs', blog().slug]" [attr.aria-label]="'Read ' + blog().title">
        <img
          appImageFallback
          [src]="blog().featuredImage?.url!"
          [alt]="blog().featuredImage?.alt || blog().title"
          loading="lazy"
        >
      </a>
    }
  </div>

  <!-- Bottom Action Toolbar -->
  <div class="card-footer">
    <div class="footer-left">
      <!-- Claps / Star Icon -->
      <button class="action-btn clap-btn" type="button" (click)="addClap($event)" title="Clap for this story">
        <svg class="icon star-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
        <span class="count">{{ getClaps() }}</span>
      </button>

      <!-- Comments Icon -->
      <a class="action-btn comment-btn" [routerLink]="['/dynamic/blogs', blog().slug, 'comments']" title="View comments">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <span class="count">{{ getCommentsCount() }}</span>
      </a>

      <!-- Repost / Share Icon -->
      <button class="action-btn share-btn" type="button" title="Share story">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span class="count">{{ getSharesCount() }}</span>
      </button>
    </div>

    <div class="footer-right">
      <!-- Dislike Icon -->
      <button class="action-btn dislike-btn" [class.active]="isDisliked()" type="button" (click)="toggleDislike($event)" title="Show less like this">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
        </svg>
      </button>

      <!-- Bookmark Ribbon Icon -->
      <button class="action-btn bookmark-btn" [class.active]="isBookmarked()" type="button" (click)="toggleBookmark($event)" title="Save story">
        <svg class="icon" viewBox="0 0 24 24" [attr.fill]="isBookmarked() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

      <!-- Options / Ellipsis Icon -->
      <button class="action-btn options-btn" type="button" title="More options">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
    </div>
  </div>
</article>
