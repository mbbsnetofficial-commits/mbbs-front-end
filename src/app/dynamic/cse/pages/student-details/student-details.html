<div class="student-details-page">
  <app-cse-progress-stepper
    [currentStep]="store.currentStep()"
    (stepClick)="onStepClick($event)"
  />

  <main class="form-container">
    <div class="form-header">
      <div class="badge-pill">Personalized AI Evaluation</div>
      <h2>Tell Us About Yourself</h2>
      <p>Enter your contact and academic details so our medical counseling experts can calculate your eligibility match.</p>
    </div>

    <form class="details-form" (ngSubmit)="onSubmit()">
      <div class="form-section">
        <h3 class="section-heading">Contact Details</h3>

        <div class="form-group">
          <label for="fullName">Full Name <span class="required">*</span></label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            class="form-control"
            placeholder="e.g. Rahul Sharma"
            [(ngModel)]="fullName"
            (ngModelChange)="updateDetails()"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="e.g. rahul@example.com"
              [(ngModel)]="email"
              (ngModelChange)="updateDetails()"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone / WhatsApp Number <span class="required">*</span></label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-control"
              placeholder="+91 98765 43210"
              [(ngModel)]="phone"
              (ngModelChange)="updateDetails()"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="city">Current City / State</label>
          <input
            type="text"
            id="city"
            name="city"
            class="form-control"
            placeholder="e.g. New Delhi"
            [(ngModel)]="city"
            (ngModelChange)="updateDetails()"
          />
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-heading">Academic Profile</h3>

        <div class="form-row">
          <div class="form-group">
            <label for="neetScore">NEET UG Score (if applicable)</label>
            <input
              type="number"
              id="neetScore"
              name="neetScore"
              class="form-control"
              placeholder="e.g. 450"
              [(ngModel)]="neetScore"
              (ngModelChange)="updateDetails()"
            />
          </div>

          <div class="form-group">
            <label for="class12Percentage">Class 12 PCB Percentage</label>
            <input
              type="number"
              id="class12Percentage"
              name="class12Percentage"
              class="form-control"
              placeholder="e.g. 82"
              [(ngModel)]="class12Percentage"
              (ngModelChange)="updateDetails()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="targetYear">Target Admission Year</label>
          <select
            id="targetYear"
            name="targetYear"
            class="form-control"
            [(ngModel)]="targetYear"
            (ngModelChange)="updateDetails()"
          >
            <option value="2026">2026 Academic Batch (Upcoming)</option>
            <option value="2027">2027 Academic Batch</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-back" (click)="goBack()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Quiz</span>
        </button>

        <button
          type="submit"
          class="btn-submit"
          [disabled]="!fullName || !email || !phone"
        >
          <span>Generate Recommendations</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
  </main>
</div>
