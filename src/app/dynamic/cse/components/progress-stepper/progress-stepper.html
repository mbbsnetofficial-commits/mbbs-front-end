<nav class="stepper-nav" aria-label="Selection Progress">
  <div class="stepper-track">
    @for (step of steps(); track step.number; let isLast = $last) {
      <div
        class="step-item"
        [class.active]="step.number === currentStep()"
        [class.completed]="step.number < currentStep()"
        [class.clickable]="step.number <= currentStep()"
        (click)="onStepClick(step.number)"
      >
        <div class="step-indicator">
          @if (step.number < currentStep()) {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          } @else {
            <span class="step-num">{{ step.number }}</span>
          }
        </div>

        <div class="step-label-group">
          <span class="step-title">{{ step.title }}</span>
          @if (step.subtitle) {
            <span class="step-subtitle">{{ step.subtitle }}</span>
          }
        </div>
      </div>

      @if (!isLast) {
        <div class="step-connector" [class.completed]="step.number < currentStep()"></div>
      }
    }
  </div>
</nav>
