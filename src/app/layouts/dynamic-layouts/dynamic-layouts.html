<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  @if (sidebarOpen()) {
    <button class="nav-backdrop" type="button" aria-label="Close navigation" (click)="closeMobileNav()"></button>
  }

  <aside class="sidebar" [class.open]="sidebarOpen()" aria-label="Student navigation">
    <div class="brand">
      <a class="brand-link" routerLink="/dynamic/neet" aria-label="MBBS.NET NEET learning area" (click)="closeMobileNav()">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 34 34"><path d="M17 4v26M4 17h26"/><path d="M11 8h12v18H11z"/></svg>
        </span>
        <span class="brand-copy"><strong>MBBS<span>.NET</span></strong><small>Learn medicine differently</small></span>
      </a>
      <button
        class="collapse-button"
        type="button"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.aria-expanded]="!sidebarCollapsed()"
        (click)="sidebarCollapsed.set(!sidebarCollapsed())"
      ><app-icon name="chevron" [size]="15"/></button>
    </div>

    <nav aria-label="Primary">
      <span class="nav-label">Preparation</span>
      <button
        class="nav-parent"
        type="button"
        data-label="NEET"
        [class.expanded]="neetOpen()"
        [attr.aria-expanded]="neetOpen()"
        aria-controls="neet-subnav"
        (click)="neetOpen.set(!neetOpen())"
      >
        <span class="nav-icon"><app-icon name="test" [size]="19"/></span>
        <span>NEET</span>
        <app-icon class="nav-chevron" name="chevron" [size]="15"/>
      </button>
      @if (neetOpen() && !sidebarCollapsed()) {
        <div id="neet-subnav" class="subnav">
          <a routerLink="/dynamic/neet/quick-test" routerLinkActive="active" (click)="closeMobileNav()">Practice Tests</a>
          <a routerLink="/dynamic/neet/previous-year-tests" routerLinkActive="active" (click)="closeMobileNav()">Previous Year Questions</a>
          <a routerLink="/dynamic/neet" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileNav()">Question of the Day</a>
          <a routerLink="/dynamic/neet/leaderboard" routerLinkActive="active" (click)="closeMobileNav()">Performance</a>
        </div>
      }
      <button
        class="nav-parent"
        type="button"
        data-label="UCAT"
        [class.expanded]="ucatOpen()"
        [attr.aria-expanded]="ucatOpen()"
        aria-controls="ucat-subnav"
        (click)="ucatOpen.set(!ucatOpen())"
      >
        <span class="nav-icon"><app-icon name="test" [size]="19"/></span>
        <span>UCAT</span>
        <app-icon class="nav-chevron" name="chevron" [size]="15"/>
      </button>
      @if (ucatOpen() && !sidebarCollapsed()) {
        <div id="ucat-subnav" class="subnav">
          <a routerLink="/dynamic/ucat" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileNav()">Practice Test</a>
          <a routerLink="/dynamic/ucat/previous-year" routerLinkActive="active" (click)="closeMobileNav()">Previous Year Papers</a>
        </div>
      }
      <a
        routerLink="/dynamic/blogs"
        routerLinkActive="active"
        data-label="Blogs"
        (click)="closeMobileNav()"
      >
        <span class="nav-icon"><app-icon name="bookmark" [size]="19"/></span>
        <span>Blogs</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-button" type="button" [disabled]="loggingOut()" (click)="onLogout()">
        <app-icon name="logout" [size]="19"/>
        <span>{{ loggingOut() ? 'Signing out…' : 'Logout' }}</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <button class="mobile-menu" type="button" aria-label="Open navigation" (click)="sidebarOpen.set(true)">
      <app-icon name="menu" [size]="21"/>
    </button>

    <main class="content" tabindex="-1"><router-outlet/></main>
  </div>
</div>
