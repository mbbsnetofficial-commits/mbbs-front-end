<header class="site-header">
  <a class="brand" routerLink="/" aria-label="MBBS home">
    <span class="brand-mark">
      <img src="/images/app-logo.png" alt="MBBS Logo" class="brand-logo-img" />
    </span>
    <img src="/images/mbbs-logo.png" alt="Mbbs" class="brand-name-img" />
  </a>

  <nav class="header-actions" aria-label="Account navigation">
    <a
      class="login-link"
      routerLink="/auth/login"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Login
    </a>
    <a
      class="register-button"
      routerLink="/auth/register"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Register
    </a>
  </nav>
</header>

<main class="layout-content">
  <router-outlet></router-outlet>
</main>
